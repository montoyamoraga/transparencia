<!DOCTYPE html>
<html>
  <head>
<!-- character encoding -->
    <meta charset="utf-8" />
    <!-- favicon -->
    <link rel="icon" type="image/png" href="./media/favicon.png" />
    <!-- viewport, so phones use their real width instead of a zoomed-out desktop view -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./libraries/p5.js"></script>
    <script src="./libraries/js-yaml.min.js"></script>
    <script src="./js/sketch.js"></script>
    <title>transparency ~ aar&#xf3;n montoya-moraga</title>
    <style>

      * {
        font-size: 1em;
      }
      body {
        padding: 0;
        margin: 0;
      }
      p, h1, h2, h3, h4, h5, h6, option {
          /*set font to Avantgarde, with fallbacks for phones that lack it*/
          font-family: Avantgarde, "Century Gothic", sans-serif;
          /*break long words and links instead of overflowing on narrow screens*/
          overflow-wrap: anywhere;
          /*normal text, no italics, no bold*/
          font-weight: normal;
          /*centered text*/
          text-align: center;
          /*display in block*/
          display: block;
          /*reset margin and padding for google chrome */
          -webkit-margin-before: 0;
          -webkit-margin-after: 0;
          -webkit-margin-start: 0;
          -webkit-margin-end: 0;
          -webkit-padding-start: 0;
          /*no padding (inner space of element)*/
          padding: 3%;
          /*margin (outter space of element)*/
          /*first reset, then set actual value wanted*/
          /*margin: 0.3em;*/
      }
      /*center the content vertically, and let it grow and scroll when long*/
      #everything {
        box-sizing: border-box;
        min-height: 100vh;
        max-width: 40em;
        margin: 0 auto;
        padding: 1em;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      select {
        display: block;
        margin: 0 auto;
        max-width: 100%;
        /*16px or larger stops iOS from zooming in when the menu is tapped*/
        font-size: 16px;
        /*bigger touch target*/
        padding: 0.5em 1em;
      }
      /*images fill the column on phones, instead of the 50% set in sketch.js*/
      #currentQuery img {
        width: 100%;
        height: auto;
      }

      a {
      /*reset of format*/
      text-decoration: none;
      font-family: Avantgarde, "Century Gothic", sans-serif;
      color: black;
      margin: 0;
      outline: 0;
      border: 0;
      }

      a:hover{
          opacity: 0.5;
      }


    </style>
  </head>
  <body>

    <div id="everything">

      <p>transparency ~ by <a href="http://montoyamoraga.io/"> aar&#xf3;n montoya-moraga</a></p>

      <select id="selectMenu" oninput="selectChange(this.value)">
        <option value="choose">choose</option>
      </select>
      <p id="currentQuery"></p>
    </div>

  </body>
</html>
